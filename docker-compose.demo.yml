# DEMO MODE: run the whole app WITHOUT an OpenAI key.
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
# A tiny stand-in (dev/fake-openai.mjs) replaces the OpenAI API. It is not an AI: embeddings match shared words only
# and answers are just the best-matching sentence with its source number. Use it to see how the product behaves.
services:
  fake-openai:
    image: node:22-alpine
    container_name: rag-fake-openai
    working_dir: /app
    volumes:
      - ./dev:/app:ro
    command: ["node", "fake-openai.mjs", "8099"]

  app:
    depends_on:
      fake-openai:
        condition: service_started
    environment:
      OPENAI_BASE_URL: http://fake-openai:8099/v1
      OPENAI_API_KEY: demo-key-not-a-real-key
